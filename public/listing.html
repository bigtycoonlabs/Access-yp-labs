<script>
const id=new URLSearchParams(location.search).get('id');
const moverSlug=new URLSearchParams(location.search).get('m')||'';
const statusEl=document.getElementById('status'), detail=document.getElementById('detail');
function money(c){return '$'+((c||0)/100).toFixed(2);}
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}

// The dream, up front: what this project is, and what it would be like to own it running as a
// business. Honest and evocative — it never invents specific outcomes; it frames what claiming
// a pre-proven project on this platform actually means. The project-specific "what it does"
// comes from the working demo and previews below.
function dreamHero(listing){
  const cat=(listing.category||'concept').replace(/_/g,' ');
  const box=el('div','panel hero-dream');box.setAttribute('aria-label','What you would be claiming');
  box.appendChild(el('h2',null,'What it’s like to own this'));
  box.appendChild(el('p',null,
    '“'+listing.title+'” is a '+cat+' business that Clay shaped end to end before it exists — the plan, the market and competitor research, the marketing, and a working demo, all already built out. It isn’t a template or a course. It’s the whole business, waiting for an owner.'));
  box.appendChild(el('p',null,
    'Picture it live: a '+cat+' business with your name on it, up and running — one you didn’t have to dream up, research, or prove from a blank page, because that work is done. Claim it below and it’s yours, exclusively, to build the rest of the way and run — or take the deeper look first: the demo, what’s inside, and what to know before you claim.'));
  return box;
}

// Risk — clearly disclosed, but after you understand the dream, not as the opening line.
function riskPanel(listing){
  if(!listing.risk_summary) return null;
  const r=el('div','panel');
  r.appendChild(el('h3',null,'Before you claim it — regulatory & licensing risk'));
  r.appendChild(el('p',null,listing.risk_summary));
  return r;
}

// The opportunity at a glance — the four scannable specifics a buyer wants: the problem, who
// they'd serve, what they could make, and why them. Shown when Clay has written the brief.
function briefPanel(listing){
  const b=listing.brief; if(!b || typeof b!=='object') return null;
  const rows=[['The problem it solves',b.problem],['Who you’d serve',b.customer],['What you could make',b.earning],['Why you',b.why_you]].filter(function(r){return r[1];});
  if(!rows.length) return null;
  const p=el('div','panel'); p.setAttribute('aria-label','The opportunity at a glance');
  p.appendChild(el('h2',null,'The opportunity at a glance'));
  rows.forEach(function(r){ const line=el('p'); line.appendChild(el('strong',null,r[0]+': ')); line.appendChild(document.createTextNode(r[1])); p.appendChild(line); });
  return p;
}

// Clay's take — the compelling read on the opportunity itself: why it's worth doing, the real
// pain it answers, and the honest challenge. This is the narrative that makes a listing specific
// instead of generic. Shown for everyone, right after the proof badge.
function takePanel(listing){
  if(!listing.clays_take || !String(listing.clays_take).trim()) return null;
  const p=el('div','panel'); p.setAttribute('aria-label','Clay’s take on this opportunity');
  p.appendChild(el('h2',null,'Clay’s take on this opportunity'));
  p.appendChild(el('p',null,String(listing.clays_take).trim()));
  return p;
}

// The honest picture — the four things every buyer deserves to understand at a glance, on EVERY
// live listing, with honest fallbacks so none of the four is ever silently blank: what you get,
// the proof so far, the risk that remains, and your first step after you claim it.
function firstStep(ns){
  try{
    if(Array.isArray(ns) && ns.length){ const s=ns[0]; return typeof s==='string'?s:(s&&s.text?s.text:null); }
  }catch(_){}
  return null;
}
function clarityBlock(listing){
  const box=el('div','panel');box.setAttribute('aria-label','The honest picture, in plain terms');
  box.appendChild(el('h2',null,'The honest picture'));
  function part(label,text){
    const p=el('p');p.appendChild(el('strong',null,label+' '));p.appendChild(document.createTextNode(text));return p;
  }

  const stageWord={project:'a shaped project, not yet built',in_build:'a project already part-built',prepared_to_start:'a project prepared and ready to start'}[listing.stage_label]||'a shaped project';
  let getting='You are claiming the full project package — '+stageWord+', yours exclusively once you claim it.';
  if(listing.completion_target) getting+=' The seller expects it can be launch-ready by '+listing.completion_target+'.';
  box.appendChild(part('What you get:',getting));

  // The creator staying on to help is the answer to the buyer's real fear — not "is this idea good"
  // but "can I actually pull this off". Show the FULL declared scope before anyone pays, and say
  // plainly what it is not: no ownership stake, and removable at any time.
  if(listing.partner_offered){
    const lp=el('div','panel');
    lp.appendChild(el('h2',null,'The creator will stay on as your launch partner'));
    const areas=(listing.partner_areas||[]).join(', ');
    let howMuch='';
    if(listing.partner_sessions&&listing.partner_weeks) howMuch=listing.partner_sessions+' session'+(listing.partner_sessions===1?'':'s')+' over '+listing.partner_weeks+' week'+(listing.partner_weeks===1?'':'s');
    else if(listing.partner_sessions) howMuch=listing.partner_sessions+' session'+(listing.partner_sessions===1?'':'s');
    else if(listing.partner_weeks) howMuch=listing.partner_weeks+' week'+(listing.partner_weeks===1?'':'s')+' of help';
    lp.appendChild(el('p',null,'Included in the price'+(areas?(' \u2014 help with '+areas):'')+(howMuch?(', '+howMuch):'')+'.'));
    if(listing.partner_scope) lp.appendChild(el('p',null,listing.partner_scope));
    lp.appendChild(el('p','muted','What this is not: they do not keep any ownership \u2014 the project transfers to you completely. There is no stake and no share. You can end the arrangement at any time, for any reason, and you keep the project. Access YP Labs takes no extra fee for this and is not a party to how it goes.'));
    box.appendChild(lp);
  }

  // The same project can also be looking for a launch partner. Point at that side rather than
  // hiding a second way in: some people don't want to BUY it, they want to help build it.
  if(listing.partner_request_id){
    const pp=el('div','panel');
    pp.appendChild(el('h2',null,'This creator is also looking for a launch partner'));
    pp.appendChild(el('p',null,'You do not have to buy this project to be part of it. The creator is open to someone joining them to help build it — read what they need, and tell them what you would bring.'));
    const pa=el('a','btn secondary','See what they need, and offer to help');
    pa.href='/partners.html'; pa.style.textDecoration='none'; pa.style.lineHeight='44px'; pa.style.display='inline-block';
    pp.appendChild(pa);
    box.appendChild(pp);
  }

  const bits=[];
  if(listing.waiting>0) bits.push(listing.waiting+(listing.waiting===1?' person has':' people have')+' already raised a hand for it');
  if(listing.research_grounded) bits.push('it was written against real research');
  if(listing.claims_verified===true) bits.push('its specific claims passed a source check');
  let proofText;
  if(bits.length){ const j=bits.join('; '); proofText=j.charAt(0).toUpperCase()+j.slice(1)+'.'; }
  else proofText='It has not been independently proven yet — the proof is still ahead of it. Treat it as a strong starting point, not a validated business.';
  box.appendChild(part('The proof so far:',proofText));

  const riskText=(listing.risk_summary&&String(listing.risk_summary).trim())
    ? String(listing.risk_summary).trim()
    : 'No major regulatory or licensing risk was flagged — but no idea is risk-free. Review it yourself, and expect the real test to be whether customers show up.';
  box.appendChild(part('The risk that remains:',riskText));

  const step=firstStep(listing.next_steps);
  const stepText=step
    ? step
    : 'The seller hasn’t set a first step yet. Before you commit, open it and have Clay name the first proof step — one real action a stranger can take.';
  box.appendChild(part('Your first step after you claim it:',stepText));

  return box;
}
async function loadPreview(container){
  const box=el('div','panel'); box.appendChild(el('h2',null,'What’s inside this dream'));
  const body=el('div'); box.appendChild(body); container.appendChild(box);
  body.textContent='Loading preview…';
  try{
    const {description}=await Kiln.api('/listings/'+id+'/demo-description',{auth:false});
    body.textContent='';
    if(!description){ body.appendChild(el('p','muted','The seller hasn’t attached a previewable demo yet — the full package still transfers when you claim it.')); return; }
    if(description.title){ body.appendChild(el('p',null,'Demo: '+description.title)); }
    if(description.items&&description.items.length){
      const ul=el('ul'); description.items.forEach(function(it){ ul.appendChild(el('li',null,it)); }); body.appendChild(ul);
    }
    if(description.a11y){
      const a=description.a11y;
      body.appendChild(el('p', a.ok?'msg ok':'muted', a.summary));
      if(a.issues&&a.issues.length){ const ul=el('ul'); a.issues.forEach(function(is){ ul.appendChild(el('li',null,is)); }); body.appendChild(ul); }
      announce(a.summary,true);
    }
  }catch(e){ body.textContent=''; body.appendChild(el('p','muted','A preview isn’t available for this listing.')); }
}
async function renderWaitlist(container, conceptId, listingId){
  if(!conceptId) return;
  const sec=el('section','panel'); sec.setAttribute('aria-labelledby','wl-h');
  const h=el('h3',null,'Join the waitlist'); h.id='wl-h'; sec.appendChild(h);
  sec.appendChild(el('p','muted','Raise your hand for this business before it launches. No account needed.'));
  const countP=el('p','muted','Checking interest…'); sec.appendChild(countP);
  try{
    const c=await Kiln.api('/waitlist/'+conceptId+'/count',{auth:false});
    countP.textContent = c.count>0
      ? (c.count+(c.count===1?' person is':' people are')+' already waiting for this.')
      : 'Be the first to raise your hand for this one.';
  }catch(_){ countP.textContent=''; }
  const ref=new URLSearchParams(location.search).get('ref')||'';
  const nameL=el('label',null,'Your name (optional)'); nameL.setAttribute('for','wl-name');
  const nameI=el('input'); nameI.id='wl-name'; nameI.type='text'; nameI.maxLength=80;
  const emailL=el('label',null,'Your email'); emailL.setAttribute('for','wl-email');
  const emailI=el('input'); emailI.id='wl-email'; emailI.type='email'; emailI.setAttribute('required','');
  const btn=el('button','btn','Join the waitlist'); btn.type='button';
  const out=el('div'); out.setAttribute('role','status'); out.setAttribute('aria-live','polite');
  btn.addEventListener('click', async ()=>{
    const email=(emailI.value||'').trim();
    if(!email){ announce('Please enter your email.',true); emailI.focus(); return; }
    btn.disabled=true;
    try{
      const r=await Kiln.api('/waitlist/'+conceptId,{auth:false,method:'POST',body:{email,name:nameI.value||undefined,ref:ref||undefined}});
      out.innerHTML='';
      out.appendChild(el('p','msg ok', r.message+(r.count?(' You\u2019re one of '+r.count+' waiting.'):'')));
      const share=location.origin+'/listing.html?id='+encodeURIComponent(listingId)+'&ref='+encodeURIComponent(r.ref_code);
      out.appendChild(el('p','muted','Share this project to grow its waitlist: '+share));
      announce(r.message+' There are now '+r.count+' people waiting.',true);
    }catch(e){ out.innerHTML=''; out.appendChild(el('p','msg err', e.message)); announce(e.message,true); }
    finally{ btn.disabled=false; }
  });
  sec.appendChild(nameL); sec.appendChild(nameI);
  sec.appendChild(emailL); sec.appendChild(emailI);
  sec.appendChild(btn); sec.appendChild(out);
  container.appendChild(sec);
}
async function load(){
  if(!id){statusEl.textContent='No listing specified.';return;}
  try{
    const {listing}=await Kiln.api('/listings/'+id,{auth:false});
    statusEl.textContent='';
    detail.appendChild(el('h1',null,listing.title));
    detail.appendChild(el('p','muted',(listing.category||'').replace(/_/g,' ')+' · '+(listing.stage_label||'').replace(/_/g,' ')+' · by '+listing.seller_alias));
    if(listing.working_since){detail.appendChild(el('p','muted','In development since '+new Date(listing.working_since).toLocaleDateString()));}
    // Lead with the dream, not the fine print: what this project is and what it's like to own it.
    detail.appendChild(dreamHero(listing));
    var askP=el('p');askP.style.margin='2px 0 16px';
    var askA=el('a','btn secondary','Ask Clay about this dream');askA.href='/app.html';askA.style.textDecoration='none';
    askP.appendChild(askA);detail.appendChild(askP);

    const isAuction=listing.format==='auction';
    const closed=isAuction && listing.auction_close_at && new Date(listing.auction_close_at)<new Date();
    let highBid=0, winnerIsMe=false;
    if(isAuction){
      try{ const {bids}=await Kiln.api('/bids/'+id,{auth:false}); if(bids.length) highBid=bids[0].amount_cents; }catch(_){}
      const base=Math.max(listing.starting_bid_cents||0, highBid);
      detail.appendChild(el('p','price', highBid? ('Current high bid '+money(highBid)) : ('Auction — starting at '+money(listing.starting_bid_cents))));
      if(listing.auction_close_at){
        detail.appendChild(el('p','muted', (closed?'Auction closed on ':'Auction closes ')+new Date(listing.auction_close_at).toLocaleString()));
      }
    }else{
      detail.appendChild(el('p','price', money(listing.price_cents)));
    }

    const pb=window.proofBadge(listing,{full:true}); if(pb) detail.appendChild(pb);

    // Clay's take on the opportunity, then the specifics at a glance, then the honest facts.
    const tk=takePanel(listing); if(tk) detail.appendChild(tk);
    const bp=briefPanel(listing); if(bp) detail.appendChild(bp);
    detail.appendChild(clarityBlock(listing));

    if(!Kiln.isLoggedIn()){
      const back=encodeURIComponent(location.pathname+location.search);
      loadPreview(detail);
      await renderWaitlist(detail, listing.concept_id, id);
      const rp0=riskPanel(listing); if(rp0) detail.appendChild(rp0);
      const box=el('div','panel');
      box.appendChild(el('p',null,'This is a project from the Dream Market — a business you can own and build before it exists. Create a free account to claim it, place a bid, or follow it before it launches.'));
      const p=el('p');p.style.display='flex';p.style.gap='10px';p.style.flexWrap='wrap';
      const create=el('a','btn','Create a free account to claim this');create.href='/register.html?next='+back;
      const signin=el('a','btn secondary','I already have an account');signin.href='/login.html?next='+back;
      p.appendChild(create);p.appendChild(signin);box.appendChild(p);
      detail.appendChild(box);
      announce('This project is open to view. Create a free account to claim it, bid, or follow it before it launches.');
      return;
    }
    // The claim/purchase action lives right here, up front, inside the listing — one tap starts it.
    if(isAuction && !closed){
      const bidWrap=el('div','panel');bidWrap.appendChild(el('h2',null,'Place a bid'));
      const bl=el('label',null,'Your bid in US dollars (must beat the current high)');bl.setAttribute('for','bid');
      const bi=el('input');bi.id='bid';bi.type='number';bi.min='10';bi.step='1';
      const minNext=Math.max(10, Math.floor((Math.max(listing.starting_bid_cents||0, highBid))/100)+1);
      bi.value=String(minNext);
      const bb=el('button','btn','Place bid');bb.type='button';
      const bout=el('div');bout.setAttribute('role','alert');bout.setAttribute('aria-live','assertive');
      bb.addEventListener('click',async()=>{
        bout.textContent='';const d=parseInt(bi.value,10);
        if(!d||d<10){bout.appendChild(el('p','msg err','Bid must be at least $10.'));announce('Bid must be at least $10.',true);return;}
        bb.disabled=true;announce('Placing your bid…');
        try{await Kiln.api('/bids/'+id,{method:'POST',body:{amount_cents:d*100}});
          announce('Bid placed at '+money(d*100)+'.',true);location.reload();
        }catch(e){bout.appendChild(el('p','msg err',e.message));announce(e.message,true);bb.disabled=false;}
      });
      [bl,bi,bb,bout].forEach(n=>bidWrap.appendChild(n));detail.appendChild(bidWrap);
    }else{
      const buy=el('button','btn', isAuction?'Complete auction purchase (winner only)':'Claim this dream');buy.type='button';
      buy.addEventListener('click',()=>openBuy(listing));
      const bp=el('p');bp.id='claim-anchor';bp.style.margin='4px 0 12px';bp.appendChild(buy);detail.appendChild(bp);
    }

    // Then the deeper look — what it does and what's inside. Optional; you can already claim above.
    loadPreview(detail);
    renderPreviews(detail, id);
    renderDemoDescription(detail, id);
    await renderWaitlist(detail, listing.concept_id, id);

    // The fine print — on the page here, and re-shown at the moment you claim.
    const rp=riskPanel(listing); if(rp) detail.appendChild(rp);

    // Secondary actions.
    const actions=el('div','actions');actions.style.display='flex';actions.style.gap='10px';actions.style.flexWrap='wrap';
    const watch=el('button','btn secondary','Add to watchlist');watch.type='button';
    watch.addEventListener('click',async()=>{try{await Kiln.api('/watches/'+id,{method:'POST'});announce('Added to your watchlist.',true);watch.textContent='On your watchlist';watch.disabled=true;}catch(e){announce(e.message,true);}});
    const report=el('button','btn secondary','Report this listing');report.type='button';
    report.addEventListener('click',async()=>{
      const reason=window.prompt('Why are you reporting this listing? (policy concern, fraud, etc.)');
      if(!reason)return;
      try{await Kiln.api('/reports',{method:'POST',body:{target_type:'listing',target_id:id,reason}});announce('Thank you — staff will review this.',true);}
      catch(e){announce(e.message,true);}
    });
    actions.appendChild(watch);actions.appendChild(report);detail.appendChild(actions);
  }catch(e){statusEl.textContent='Could not load this listing: '+e.message;}
}
function openBuy(listing){
  const f=el('div','panel');f.appendChild(el('h2',null,'Complete your purchase'));
  f.appendChild(el('p','muted','This is a neutral, escrowed transfer. All sales are final — there are no refunds.'));
  if(listing.risk_summary){f.appendChild(el('p','muted','Before you confirm — regulatory & licensing risk:'));f.appendChild(el('p',null,listing.risk_summary));}
  const mk=(txt)=>{const w=el('label');w.style.fontWeight='400';const c=el('input');c.type='checkbox';c.style.width='auto';c.style.minHeight='auto';c.style.marginRight='10px';w.appendChild(c);w.appendChild(document.createTextNode(' '+txt));f.appendChild(w);return c;}
  const a1=mk('I accept the transfer agreement.');
  const a2=mk('I acknowledge the risk in this project.');
  const a3=mk('I understand this purchase is final and non-refundable.');
  const out=el('div');out.setAttribute('role','alert');out.setAttribute('aria-live','assertive');
  const go=el('button','btn','Confirm purchase');go.type='button';
  go.addEventListener('click',async()=>{
    out.textContent='';
    if(!a1.checked||!a2.checked||!a3.checked){const m='Please confirm all three acknowledgments.';out.appendChild(el('p','msg err',m));announce(m,true);return;}
    go.disabled=true;announce('Creating your order…');
    try{
      const {order,checkout}=await Kiln.api('/orders',{method:'POST',body:{listing_id:id,agreement_accepted:true,risk_ack:true,no_refund_ack:true,mover:moverSlug||undefined}});
      if(checkout&&checkout.url){announce('Redirecting to secure checkout.');location.href=checkout.url;return;}
      // Checkout did not start. Say WHY, from the reason the server actually gave, instead of
      // always blaming seller onboarding — telling a buyer the seller needs to finish setup when
      // the truth is our payments are misconfigured sends them to chase the wrong person, and
      // makes a seller look unprepared when they are not.
      var why = (checkout && checkout.reason) || 'unknown';
      var said = {
        seller_not_onboarded: 'The seller has not finished setting up payouts yet, so payment cannot be taken. Your order is saved and nothing has been charged.',
        stripe_not_configured: 'Payments are not switched on right now, so checkout could not open. Your order is saved and nothing has been charged — this is on our side, not the seller\u2019s.',
        stripe_error: 'Our payments provider refused to open checkout just now. Your order is saved and nothing has been charged. Worth trying again shortly.'
      }[why] || 'Checkout could not open just now. Your order is saved and nothing has been charged.';
      out.appendChild(el('p','msg', said + ' Your order id is ' + order.id + '.'));
      announce(said, true);
      announce('Order created. Awaiting seller payout onboarding.',true);
    }catch(e){out.appendChild(el('p','msg err',e.message));announce(e.message,true);go.disabled=false;}
  });
  f.appendChild(go);f.appendChild(out);
  const anchor=document.getElementById('claim-anchor');
  if(anchor&&anchor.parentNode){anchor.parentNode.insertBefore(f,anchor.nextSibling);}else{detail.appendChild(f);}
  focusEl(f.querySelector('h2'),'Purchase started — complete it below.');
}
async function renderDemoDescription(container, listingId){
  let desc=null;
  try{ const r=await Kiln.api('/listings/'+listingId+'/demo-description'); desc=r.description; }catch(_){ return; }
  if(!desc) return;
  const sec=el('div','panel'); sec.appendChild(el('h2',null,'What the demo contains'));
  sec.appendChild(el('p','muted','A plain, screen-reader-friendly description of the interactive demo, so you know what you are buying.'));
  const ul=document.createElement('ul');
  (desc.items||[]).forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
  sec.appendChild(ul);
  if(desc.a11y){ sec.appendChild(el('p', desc.a11y.ok?'msg ok':'muted', desc.a11y.summary||'')); }
  container.appendChild(sec);
}
function b64utf8(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
async function renderPreviews(container, listingId){
  let assets=[];
  try{ const r=await Kiln.api('/listings/'+listingId+'/assets'); assets=r.assets||[]; }catch(_){ return; }
  if(!assets.length) return;
  const sec=el('div','panel'); sec.appendChild(el('h2',null,'Preview the materials'));
  sec.appendChild(el('p','muted','Previews are watermarked. The full, clean materials transfer to you when you buy.'));
  const acts=el('div','actions'); acts.style.display='flex'; acts.style.gap='8px'; acts.style.flexWrap='wrap';
  assets.forEach(a=>{
    const b=el('button','btn secondary','Preview: '+(a.title||a.type)); b.type='button';
    b.addEventListener('click',()=>showPreview(sec, a.id, a.title||a.type));
    acts.appendChild(b);
  });
  sec.appendChild(acts); container.appendChild(sec);
}
async function showPreview(container, assetId, label){
  announce('Loading watermarked preview of '+label+'…');
  try{
    const {preview}=await Kiln.api('/assets/'+assetId+'/preview');
    const content=b64utf8(preview.content_b64);
    const wrap=el('div'); wrap.appendChild(el('h3',null,'Preview: '+label+' (watermarked)'));
    if(preview.format==='html'){
      const frame=document.createElement('iframe'); frame.setAttribute('sandbox','allow-same-origin');
      frame.setAttribute('title','Watermarked preview of '+label);
      frame.style.width='100%'; frame.style.height='420px'; frame.style.border='1px solid var(--line)';
      frame.srcdoc=content; wrap.appendChild(frame);
    } else {
      const body=el('div','asset-body',content); body.setAttribute('tabindex','-1');
      body.setAttribute('role','region'); body.setAttribute('aria-label','Watermarked preview of '+label);
      wrap.appendChild(body);
    }
    container.appendChild(wrap); focusEl(wrap.querySelector('h3'),'Watermarked preview loaded.');
  }catch(e){ announce('Could not load preview: '+e.message, true); }
}
load();
