<a class="skip" href="#main">Skip to main content</a>
<header class="site"><div class="wrap bar">
  <a class="brand" href="/">Access YP Labs</a>
  <nav class="top" aria-label="Primary"><a href="/register.html">Create account</a></nav>
</div></header>
<main id="main" class="wrap">
  <h1>Sign in</h1>
  <div id="feedback" role="alert" aria-live="assertive"></div>
  <div class="panel">
    <div class="stack">
      <div><label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required/></div>
      <div><label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required/></div>
      <button class="btn" id="submit" type="button">Sign in</button>

      <!-- A locked-out person previously had no route back in, and this page did not even
           acknowledge it was possible. Forgetting a password meant losing every project. -->
      <p><a href="#" id="forgot-link">I have forgotten my password</a></p>
      <div id="forgot" hidden>
        <label for="forgot-email">Your email</label>
        <input id="forgot-email" type="email" autocomplete="email"/>
        <p><button type="button" class="btn secondary" id="forgot-go">Send me a reset link</button></p>
        <p id="forgot-said" role="status" aria-live="polite" class="muted"></p>
      </div>
    </div>
  </div>
  <p class="muted">New here? <a href="/register.html">Create an account</a>.</p>
</main>
<script src="/js/a11y.js?v=20260807n"></script><script src="/js/api.js?v=20260807n"></script><script src="/js/nav.js?v=20260807n"></script>
<script>
const fb = document.getElementById('feedback');
function show(msg, kind){ fb.innerHTML = '<div class="msg '+(kind||'err')+'">'+msg+'</div>'; announce(msg, true); }
async function submit(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!email || !password){ return show('Please enter your email and password.'); }
  const btn = document.getElementById('submit'); btn.disabled = true; announce('Signing in…');
  try{
    const data = await Kiln.api('/auth/login', { method:'POST', auth:false, body:{ email, password } });
    Kiln.setTokens({ accessToken:data.accessToken, refreshToken:data.refreshToken });
    announce('Signed in. Opening your laboratory.'); { const n=new URLSearchParams(location.search).get('next'); location.href = (n && n.charAt(0)==='/' && n.charAt(1)!=='/') ? n : '/app.html'; }
  }catch(e){ show(e.message); btn.disabled = false; }
}
document.getElementById('submit').addEventListener('click', submit);
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
if(new URLSearchParams(location.search).get('session')==='expired'){ show('Your session timed out. Please sign in again \u2014 your account and your work are safe.','ok'); }

// Forgetting a password. The answer is deliberately identical whether or not the address has an
// account — "no account found" would turn this into a way to discover who is registered here.
(function(){
  var link=document.getElementById('forgot-link'); if(!link) return;
  var box=document.getElementById('forgot'), said=document.getElementById('forgot-said');
  link.addEventListener('click', function(e){
    e.preventDefault(); box.hidden=false; link.hidden=true;
    var f=document.getElementById('forgot-email'), typed=document.getElementById('email');
    if(typed && typed.value) f.value=typed.value;
    if(f.focus) f.focus();
    announce('Enter your email and we will send a reset link.', true);
  });
  document.getElementById('forgot-go').addEventListener('click', async function(){
    var b=document.getElementById('forgot-go'); b.disabled=true; said.textContent='Sending…';
    try{
      var r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:document.getElementById('forgot-email').value})});
      var d=await r.json();
      said.textContent=d.message||'If there is an account for that address, a reset link is on its way.';
    }catch(e){ said.textContent='Could not reach us just now. Please try again in a moment.'; }
    announce(said.textContent, true); b.disabled=false;
  });
})();
</script>
