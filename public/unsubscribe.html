<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unsubscribe — Access YP Labs</title><link rel="stylesheet" href="/css/kiln.css"/>
  <meta name="robots" content="noindex, nofollow"/>
</head><body>
<a class="skip" href="#main">Skip to main content</a>
<header class="site"><div class="wrap bar">
  <a class="brand" href="/">Access YP Labs</a>
</div></header>
<main id="main" class="wrap">
  <h1>Leave this waitlist?</h1>
  <div class="panel">
    <p>You joined a waitlist for an idea on Access YP Labs. Click below to stop receiving emails about it.</p>
    <button id="go" class="btn" type="button">Yes, unsubscribe me</button>
    <div id="out" role="status" aria-live="polite"></div>
  </div>
</main>
<script src="/js/a11y.js?v=20260806c"></script><script src="/js/api.js?v=20260806c"></script>
<script>
(function(){
  const code=new URLSearchParams(location.search).get('code');
  const out=document.getElementById('out'); const go=document.getElementById('go');
  if(!code){ go.disabled=true; out.innerHTML='<p class="msg err">This unsubscribe link is missing its code.</p>'; return; }
  go.addEventListener('click', async ()=>{
    go.disabled=true;
    try{
      await Kiln.api('/waitlist/leave',{auth:false,method:'POST',body:{ref_code:code}});
      out.innerHTML='<p class="msg ok">Done — you\u2019ve been removed. You won\u2019t hear about this idea again.</p>';
      announce('You have been unsubscribed from this waitlist.',true);
    }catch(e){ out.innerHTML='<p class="msg err">'+e.message+'</p>'; go.disabled=false; announce(e.message,true); }
  });
})();
</script>
  <footer style="border-top:1px solid var(--line);color:var(--muted);font-size:15px;padding:22px 24px;text-align:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <nav aria-label="Legal">
      <a href="/terms.html" style="color:var(--clay-dark);display:inline-block;min-height:44px;line-height:44px;margin:0 4px">Terms of Service</a> ·
      <a href="/privacy.html" style="color:var(--clay-dark);display:inline-block;min-height:44px;line-height:44px;margin:0 4px">Privacy Policy</a> ·
      <a href="/risk.html" style="color:var(--clay-dark);display:inline-block;min-height:44px;line-height:44px;margin:0 4px">Risk Disclosure</a>
    </nav>
  </footer>
</body></html>
