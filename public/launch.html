<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coming soon — Access YP Labs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="/css/site-themes.css"/>
<style>
.shop{margin:24px 0}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:12px}
.product-card{border:1px solid rgba(0,0,0,.15);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.product-img{width:100%;height:auto;border-radius:8px;display:block}
.product-name{margin:.2em 0;font-size:1.05rem}
.product-price{font-weight:700;margin:.1em 0}
.product-desc{margin:.2em 0;opacity:.85}
.buy-form{margin-top:auto}
.buy-btn{width:100%}
</style>
</head>
<body class="sitebody" data-theme="warm">
<img id="hero" class="site-hero" alt="" hidden/>
<main class="site-wrap" id="main">
  <p id="status" role="status" aria-live="polite" style="color:var(--smut)">Loading…</p>
  <div id="page" hidden>
    <h1 id="headline"></h1>
    <p class="site-sub" id="subhead" hidden></p>
    <p class="site-blurb" id="blurb" hidden></p>
    <nav id="nav" class="sitenav" aria-label="Site pages" hidden></nav>
    <article id="article" class="article" hidden></article>
    <section id="shop" class="shop" hidden>
      <h2 id="shop-h">Shop</h2>
      <div id="shop-grid" class="product-grid"></div>
    </section>
    <div class="capture">
      <label for="email">Enter your email to be first in line</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-describedby="cap-note"/>
      <button type="button" class="btn-cta" id="join">Get early access</button>
      <p id="cap-note" class="count"></p>
      <p id="result" role="status" aria-live="polite"></p>
    </div>
    <p class="site-foot">Built on Access YP Labs, where ideas get proven before they launch.</p>
  </div>
</main>
<script>
(function(){
  var underP = location.pathname.match(/^\/p\/([^\/?#]+)(?:\/([^\/?#]+))?/);
  var hostMode = !underP;
  var slug = underP ? decodeURIComponent(underP[1]||'') : '';
  var pageSlug = underP ? (underP[2] ? decodeURIComponent(underP[2]) : '')
                        : decodeURIComponent((location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0]) || '');
  function homeHref(){ return hostMode ? '/' : '/p/'+encodeURIComponent(slug); }
  function pageHref(ps){ return hostMode ? '/'+encodeURIComponent(ps) : '/p/'+encodeURIComponent(slug)+'/'+encodeURIComponent(ps); }
  function apiHome(){ return hostMode ? '/api/site' : '/api/launch/'+encodeURIComponent(slug); }
  function apiPage(ps){ return hostMode ? '/api/site/'+encodeURIComponent(ps) : '/api/launch/'+encodeURIComponent(slug)+'/'+encodeURIComponent(ps); }
  var conceptId=null;
  var statusEl=document.getElementById('status');
  var EMAIL=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  function show(el,txt){el.textContent=txt||'';el.hidden=!txt;}
  function tally(n){return n?((n===1?'1 person has':n+' people have')+' raised their hand so far.'):'';}
  function setTheme(t){ document.body.setAttribute('data-theme', t||'warm'); }

  // Inline: [text](url) -> link; everything else is a text node. No innerHTML anywhere.
  function inline(text){
    var out=[]; var re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g; var last=0, mm;
    while((mm=re.exec(text))){
      if(mm.index>last) out.push(document.createTextNode(text.slice(last,mm.index)));
      var a=document.createElement('a'); a.href=mm[2]; a.target='_blank'; a.rel='noopener'; a.textContent=mm[1]; out.push(a);
      last=re.lastIndex;
    }
    if(last<text.length) out.push(document.createTextNode(text.slice(last)));
    return out;
  }
  // Block Markdown: headings, bullets, images, buttons, quotes, dividers, paragraphs. DOM only.
  function renderBody(container, body){
    var lines=String(body||'').replace(/\r\n/g,'\n').split('\n'); var i=0;
    function put(tag,text){var e=document.createElement(tag);inline(text).forEach(function(n){e.appendChild(n);});container.appendChild(e);}
    while(i<lines.length){
      var line=lines[i];
      if(/^\s*$/.test(line)){ i++; continue; }
      if(/^\s*([-*_])\1{2,}\s*$/.test(line)){ container.appendChild(document.createElement('hr')); i++; continue; }
      var img=line.match(/^\s*!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)\s*$/);
      if(img){ var im=document.createElement('img'); im.src=img[2]; im.alt=img[1]||''; container.appendChild(im); i++; continue; }
      var btn=line.match(/^\s*\[\[([^\]]+)\]\]\((https?:\/\/[^\s)]+)\)\s*$/);
      if(btn){ var b=document.createElement('a'); b.className='btn-cta'; b.href=btn[2]; b.target='_blank'; b.rel='noopener'; b.textContent=btn[1]; container.appendChild(b); i++; continue; }
      if(/^>\s?/.test(line)){ var q=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; } put('blockquote', q.join(' ')); continue; }
      if(/^##\s+/.test(line)){ put('h3', line.replace(/^##\s+/,'')); i++; continue; }
      if(/^#\s+/.test(line)){ put('h2', line.replace(/^#\s+/,'')); i++; continue; }
      if(/^\s*[-*]\s+/.test(line)){
        var ul=document.createElement('ul');
        while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ var li=document.createElement('li'); inline(lines[i].replace(/^\s*[-*]\s+/,'')).forEach(function(n){li.appendChild(n);}); ul.appendChild(li); i++; }
        container.appendChild(ul); continue;
      }
      var para=[lines[i]]; i++;
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,2}\s+/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^\s*!\[/.test(lines[i]) && !/^\s*\[\[/.test(lines[i])){ para.push(lines[i]); i++; }
      put('p', para.join(' '));
    }
  }
  function renderNav(pages, current){
    var nav=document.getElementById('nav');
    if(!pages || !pages.length){ nav.hidden=true; return; }
    nav.textContent='';
    var home=document.createElement('a'); home.href=homeHref(); home.textContent='Home';
    if(!current) home.setAttribute('aria-current','page'); nav.appendChild(home);
    pages.forEach(function(pg){
      var a=document.createElement('a'); a.href=pageHref(pg.slug); a.textContent=pg.title;
      if(pg.slug===current) a.setAttribute('aria-current','page'); nav.appendChild(a);
    });
    nav.hidden=false;
  }
  function setHero(url){ var h=document.getElementById('hero'); if(url){ h.src=url; h.hidden=false; } else { h.hidden=true; } }

  // Render a real, buyable shop. No innerHTML — DOM nodes only, matching this file's XSS-safe style.
  // The Buy button is a native form POST to the platform checkout, which starts a direct charge on
  // the creator's own Stripe account. checkout_action is an absolute URL so it works on the /p/
  // preview and on a creator's custom domain alike.
  function renderShop(products, action){
    var sec=document.getElementById('shop'); var grid=document.getElementById('shop-grid');
    grid.textContent='';
    if(!products || !products.length){ sec.hidden=true; return; }
    products.forEach(function(p){
      var card=document.createElement('div'); card.className='product-card';
      if(p.image_url){ var img=document.createElement('img'); img.className='product-img'; img.src=p.image_url; img.alt=p.name||''; card.appendChild(img); }
      var h=document.createElement('h3'); h.className='product-name'; h.textContent=p.name||''; card.appendChild(h);
      var pr=document.createElement('p'); pr.className='product-price'; pr.textContent=p.price_display||''; card.appendChild(pr);
      if(p.kind){ var kd=document.createElement('p'); kd.className='product-kind'; kd.textContent=(p.kind==='physical'?'Physical — ships to you':'Digital — delivered by link'); card.appendChild(kd); }
      if(p.description){ var d=document.createElement('p'); d.className='product-desc'; d.textContent=p.description; card.appendChild(d); }
      if(action && p.id){
        var f=document.createElement('form'); f.className='buy-form'; f.method='POST'; f.action=action;
        var hid=document.createElement('input'); hid.type='hidden'; hid.name='product_id'; hid.value=p.id; f.appendChild(hid);
        var b=document.createElement('button'); b.type='submit'; b.className='btn-cta buy-btn';
        b.textContent='Buy — '+(p.price_display||'');
        b.setAttribute('aria-label','Buy '+(p.name||'')+' for '+(p.price_display||''));
        f.appendChild(b); card.appendChild(f);
      }
      grid.appendChild(card);
    });
    sec.hidden=false;
  }

  async function loadHome(){
    var r=await fetch(apiHome());
    if(!r.ok){ statusEl.textContent='This page isn’t available.'; return; }
    var d=await r.json(); conceptId=d.concept_id; setTheme(d.theme);
    document.title=(d.headline||d.title||'Coming soon');
    setHero(d.hero_image);
    document.getElementById('headline').textContent=d.headline||d.title||'Coming soon';
    show(document.getElementById('subhead'),d.subhead);
    show(document.getElementById('blurb'),d.blurb);
    document.getElementById('join').textContent=d.cta_label||'Get early access';
    document.getElementById('cap-note').textContent=tally(d.count);
    renderNav(d.pages, '');
    renderShop(d.products, d.checkout_action);
    statusEl.hidden=true; document.getElementById('page').hidden=false;
  }
  async function loadSubPage(){
    var r=await fetch(apiPage(pageSlug));
    if(!r.ok){ statusEl.textContent='This page isn’t available.'; return; }
    var d=await r.json(); conceptId=d.concept_id; setTheme(d.theme);
    document.title=(d.page.title||'')+' — '+(d.site_title||'');
    var head=document.getElementById('headline'); head.textContent='';
    var homeLink=document.createElement('a'); homeLink.href=homeHref(); homeLink.textContent=d.site_title||'Home'; homeLink.className='site-home';
    head.appendChild(homeLink);
    renderNav(d.pages, d.page.slug);
    var art=document.getElementById('article');
    var h=document.createElement('h1'); h.textContent=d.page.title; art.appendChild(h);
    renderBody(art, d.page.body); art.hidden=false;
    document.getElementById('subhead').hidden=true; document.getElementById('blurb').hidden=true;
    document.getElementById('join').textContent=d.cta_label||'Get early access';
    statusEl.hidden=true; document.getElementById('page').hidden=false;
  }

  document.getElementById('join').addEventListener('click',async function(){
    var email=(document.getElementById('email').value||'').trim();
    var out=document.getElementById('result');
    if(!EMAIL.test(email)){out.style.color='#b00';out.textContent='Please enter a valid email address.';return;}
    if(!conceptId){out.style.color='#b00';out.textContent='This page isn’t available.';return;}
    var btn=document.getElementById('join'); btn.disabled=true;
    out.style.color='var(--smut)'; out.textContent='Adding you…';
    try{
      var r=await fetch('/api/waitlist/'+encodeURIComponent(conceptId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
      var d=await r.json();
      if(r.ok&&d.joined){
        out.style.color='var(--acc)';
        out.textContent=d.already?'You’re already on the list — nice.':'You’re on the list. We’ll be in touch.';
        document.getElementById('cap-note').textContent=tally(d.count);
        document.getElementById('email').value='';
      } else { out.style.color='#b00'; out.textContent=(d&&d.error)||'Could not add you right now.'; }
    }catch(e){ out.style.color='#b00'; out.textContent='Could not add you right now.'; }
    btn.disabled=false;
  });

  if(!hostMode && !slug){ statusEl.textContent='This page isn’t available.'; }
  else if(pageSlug){ loadSubPage().catch(function(){statusEl.textContent='This page isn’t available.';}); }
  else { loadHome().catch(function(){statusEl.textContent='This page isn’t available.';}); }
})();
</script>
</body>
</html>
