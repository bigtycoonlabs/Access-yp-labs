<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Descend — The Kiln</title>
<style>
:root{--ember:#ff6a1a;--ember2:#ffb347;--ash:#e7e2dd;--void:#0a0705;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--void);color:var(--ash);
  font-family:ui-serif,Georgia,"Times New Roman",serif;overflow:hidden;}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;z-index:2;}
.heat{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 120%, rgba(255,106,26,.55), rgba(255,60,0,.15) 40%, transparent 62%),
    radial-gradient(80% 60% at 50% 130%, rgba(255,179,71,.5), transparent 60%),
    var(--void);
  transition:opacity 1.2s ease, transform 1.2s ease;}
.stage.scene-descend ~ .heat, body.scene-descend .heat{transform:translateY(-6%) scale(1.15);}
.embers{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.ember{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,var(--ember2),var(--ember) 60%,transparent);
  opacity:0;animation:rise linear infinite;}
@keyframes rise{0%{opacity:0;transform:translateY(0) translateX(0) scale(1);}
  10%{opacity:.9;}90%{opacity:.7;}100%{opacity:0;transform:translateY(-105vh) translateX(var(--drift,20px)) scale(.4);}}
.kicker{letter-spacing:.32em;text-transform:uppercase;font-family:ui-monospace,monospace;font-size:.72rem;
  color:var(--ember2);opacity:.8;margin-bottom:22px;}
.line{font-size:clamp(1.5rem,4.4vw,2.9rem);line-height:1.35;max-width:18ch;margin:0 auto;
  opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease;text-wrap:balance;}
.line.show{opacity:1;transform:none;}
.controls{position:fixed;left:0;right:0;bottom:26px;z-index:3;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 16px;}
button{font:inherit;font-size:1.05rem;min-height:48px;min-width:48px;padding:12px 22px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,179,71,.5);background:rgba(20,12,8,.7);color:var(--ash);backdrop-filter:blur(4px);}
button.primary{background:linear-gradient(180deg,var(--ember2),var(--ember));color:#1a0d05;border:none;font-weight:700;}
button:focus-visible{outline:3px solid #fff;outline-offset:3px;}
.skip{position:fixed;top:16px;right:16px;z-index:3;font-size:.9rem;min-height:44px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
a.textlink{color:var(--ember2);}
@media (prefers-reduced-motion: reduce){
  .ember{display:none;} .heat{transition:opacity .6s ease;} .line{transition:opacity .5s ease;transform:none;}
}
</style></head>
<body>
<a class="sr-only" href="#enterbtn">Skip to the entrance</a>
<div class="heat" aria-hidden="true"></div>
<div class="embers" id="embers" aria-hidden="true"></div>

<main class="stage" id="stage" role="main">
  <p class="kicker" id="kicker">Access YP Labs</p>
  <p class="line show" id="line" aria-hidden="true">A door you weren’t given. You found it anyway.</p>
</main>

<!-- The equally-strange experience for screen readers: a paced, spoken descent. -->
<div class="sr-only" role="status" aria-live="polite" id="narr"></div>

<div class="controls" id="controls">
  <button class="primary" id="enterbtn">Descend into The Kiln</button>
  <button id="soundbtn" aria-pressed="false">Sound off</button>
</div>
<button class="skip" id="skipbtn">Skip the descent</button>

<script>
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var line=document.getElementById('line'), narr=document.getElementById('narr'),
    stage=document.getElementById('stage'), enterBtn=document.getElementById('enterbtn'),
    skipBtn=document.getElementById('skipbtn'), soundBtn=document.getElementById('soundbtn');

// The descent script. Each beat is one line of the experience, paced so it feels
// like falling and surfacing — the SAME arc whether you see it or hear it.
var beats = [
  {t:'Below every safe, sensible marketplace, there is a hotter one.', scene:'door'},
  {t:'So you go down. Headfirst. Into the heat, where raw ideas are still glowing.', scene:'descend'},
  {t:'This is the part where most people turn back.', scene:'descend'},
  {t:'You don’t.', scene:'descend'},
  {t:'You surface inside a marketplace that, by every reasonable rule, should not exist.', scene:'emerge'},
  {t:'Unproven. Unpolished. Untested by anyone but the people brave enough to be first.', scene:'emerge'},
  {t:'And the ideas here notice you. They lean toward you, as if they’ve been waiting for the right hands.', scene:'emerge'},
  {t:'Welcome. Something in here already has your name on it.', scene:'emerge', last:true}
];

// Ambient embers (decorative; hidden from AT; disabled for reduced motion).
if(!reduce){
  var box=document.getElementById('embers');
  for(var i=0;i<34;i++){
    var e=document.createElement('div');e.className='ember';
    e.style.left=(Math.random()*100)+'%';
    e.style.animationDuration=(5+Math.random()*7)+'s';
    e.style.animationDelay=(Math.random()*7)+'s';
    e.style.setProperty('--drift',(Math.random()*80-40)+'px');
    e.style.width=e.style.height=(4+Math.random()*6)+'px';
    box.appendChild(e);
  }
}

// Optional generated ambience (low drone + faint crackle), off by default, so it
// never competes with a screen reader unless the user chooses it.
var audioOn=false, actx=null, drone=null, crackle=null;
function startSound(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=54; g.gain.value=0.05; o.connect(g); g.connect(actx.destination); o.start();
    drone={o:o,g:g};
    var buf=actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.pow(Math.random(),8)*0.5; }
    var src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    var cg=actx.createGain(); cg.gain.value=0.06; src.connect(cg); cg.connect(actx.destination); src.start();
    crackle={src:src,g:cg};
  }catch(e){ /* audio optional */ }
}
function stopSound(){ try{ if(drone)drone.o.stop(); if(crackle)crackle.src.stop(); if(actx)actx.close(); }catch(e){} actx=drone=crackle=null; }
soundBtn.addEventListener('click',function(){
  audioOn=!audioOn; soundBtn.textContent=audioOn?'Sound on':'Sound off'; soundBtn.setAttribute('aria-pressed',String(audioOn));
  if(audioOn)startSound(); else stopSound();
});

function setScene(s){ document.body.className='scene-'+s; }
function goInside(){ if(audioOn)stopSound(); location.href='/marketplace.html?entered=1'; }

var running=false;
function runDescent(){
  if(running)return; running=true;
  enterBtn.disabled=true; enterBtn.textContent='Descending…';
  var i=0;
  function step(){
    if(i>=beats.length){ finish(); return; }
    var b=beats[i];
    setScene(b.scene);
    // visual line
    line.classList.remove('show'); 
    setTimeout(function(){ line.textContent=b.t; line.classList.add('show'); },220);
    // spoken beat (paced — this IS the experience for AT)
    narr.textContent=b.t;
    i++;
    setTimeout(step, reduce?2600:2900);
  }
  step();
}
function finish(){
  setScene('emerge');
  line.textContent='Step inside.'; line.classList.add('show');
  var go=document.createElement('button'); go.className='primary'; go.id='stepin'; go.textContent='Step inside The Kiln';
  go.addEventListener('click',goInside);
  var c=document.getElementById('controls'); c.innerHTML=''; c.appendChild(go);
  narr.textContent='You have arrived. Step inside The Kiln.';
  go.focus();
}
function skipAll(){ if(running){running=false;} finish(); }

enterBtn.addEventListener('click',runDescent);
skipBtn.addEventListener('click',skipAll);
// keyboard: Enter/Space on the primary begins; Escape skips
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ skipAll(); }
});
// Returning visitors get a gentle offer to skip (we still let them re-descend).
try{ if(localStorage.getItem('kiln_descended')){ skipBtn.textContent='Skip — you’ve been here before'; } localStorage.setItem('kiln_descended','1'); }catch(e){}
</script>
</body></html>
