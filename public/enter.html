<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Drift — The Dreamhold</title>
<style>
:root{--void:#0b0817;--dream:#b8a6ff;--dream2:#8ce0ff;--glow:#ffd9a8;--ink:#f2eefb;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:ui-serif,Georgia,"Times New Roman",serif;
  background:radial-gradient(120% 80% at 20% -10%, rgba(140,224,255,.16), transparent 55%),
    radial-gradient(120% 90% at 85% 115%, rgba(184,166,255,.20), transparent 55%), var(--void);}
.bloom{position:fixed;left:50%;top:55%;width:60vmax;height:60vmax;transform:translate(-50%,-50%) scale(.2);
  border-radius:50%;filter:blur(40px);opacity:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle, rgba(255,217,168,.5), rgba(184,166,255,.35) 45%, transparent 70%);}
body.drift .bloom{animation:bloom 3s ease-out forwards;}
@keyframes bloom{0%{opacity:0;transform:translate(-50%,-50%) scale(.2);}
  55%{opacity:.5;}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.25);}}
.motes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,var(--dream2) 55%,transparent);
  opacity:0;animation:float linear infinite;}
@keyframes float{0%{opacity:0;transform:translateY(20px) scale(.8);}
  15%{opacity:.85;}85%{opacity:.6;}100%{opacity:0;transform:translateY(-60px) scale(1.1);}}
body.drift .mote{animation-duration:2.4s !important;}
.stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;transition:transform 2.6s cubic-bezier(.35,0,.3,1);}
body.drift .stage{transform:translateY(3vh);}
.kicker{letter-spacing:.32em;text-transform:uppercase;font-family:ui-monospace,monospace;font-size:.7rem;color:var(--dream2);opacity:.85;margin-bottom:24px;}
.line{font-size:clamp(1.5rem,4.6vw,2.8rem);line-height:1.35;max-width:18ch;margin:0 auto 30px;opacity:0;transition:opacity .8s ease;text-wrap:balance;}
.line.show{opacity:1;}
button{font:inherit;font-size:1.1rem;min-height:52px;min-width:52px;padding:14px 30px;border-radius:999px;cursor:pointer;
  border:none;font-weight:700;color:#1a1230;background:linear-gradient(180deg,var(--dream),var(--dream2));box-shadow:0 0 44px rgba(140,224,255,.35);}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
@media (prefers-reduced-motion: reduce){
  .mote{display:none;} body.drift .bloom{animation:none;opacity:.8;transform:translate(-50%,-50%) scale(1.1);transition:opacity 1.2s ease;}
  body.drift .stage{transform:none;} .line{transition:opacity .5s ease;}
}
</style></head>
<body>
<div class="bloom" aria-hidden="true"></div>
<div class="motes" id="motes" aria-hidden="true"></div>
<main class="stage" role="main">
  <p class="kicker">Access YP Labs</p>
  <p class="line show" id="line" aria-hidden="true">Below every waking marketplace, a sleeping one dreams.</p>
  <button id="go">Drift into the Dreamhold</button>
</main>
<div class="sr-only" role="status" aria-live="assertive" id="narr"></div>
<script src="/js/api.js"></script>
<script>
// Account required before entering.
try{ if(!localStorage.getItem('dreamhold_onboarded')){ location.replace('/dreamhold.html'); } }catch(e){}

var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var go=document.getElementById('go'), line=document.getElementById('line'), narr=document.getElementById('narr');

// drifting dream-motes (each a sleeping idea)
if(!reduce){
  var box=document.getElementById('motes');
  for(var i=0;i<30;i++){
    var m=document.createElement('div');m.className='mote';
    var s=4+Math.random()*10; m.style.width=m.style.height=s+'px';
    m.style.left=(Math.random()*100)+'%'; m.style.top=(Math.random()*100)+'%';
    m.style.animationDuration=(4+Math.random()*6)+'s'; m.style.animationDelay=(Math.random()*5)+'s';
    box.appendChild(m);
  }
}

// A soft ~3s dream: an evolving pad, a few rising chimes, an airy drift, and a
// warm bloom as the dreams turn toward you. Dreamy — never a hard impact.
function playDream(){
  var actx; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  var now=actx.currentTime, master=actx.createGain(); master.gain.value=0.8; master.connect(actx.destination);
  [174,220,262].forEach(function(f,i){
    var o=actx.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=(i-1)*6;
    var g=actx.createGain(); g.gain.setValueAtTime(0.0001,now);
    g.gain.linearRampToValueAtTime(0.05,now+0.9); g.gain.linearRampToValueAtTime(0.0001,now+3.2);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+3.3);
  });
  [523,659,784,988,1175].forEach(function(base,i){
    var t=[0.2,0.7,1.2,1.9,2.5][i];
    var o=actx.createOscillator(); o.type='sine'; o.frequency.value=base;
    var g=actx.createGain(); g.gain.setValueAtTime(0.0001,now+t);
    g.gain.exponentialRampToValueAtTime(0.06,now+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.9);
    o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+1.0);
  });
  var nb=actx.createBuffer(1,Math.floor(actx.sampleRate*3),actx.sampleRate), nd=nb.getChannelData(0);
  for(var i=0;i<nd.length;i++){ nd[i]=(Math.random()*2-1); }
  var n=actx.createBufferSource(); n.buffer=nb;
  var nf=actx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=520;
  var ng=actx.createGain(); ng.gain.setValueAtTime(0.0001,now); ng.gain.linearRampToValueAtTime(0.03,now+1.0); ng.gain.linearRampToValueAtTime(0.0001,now+3.0);
  n.connect(nf); nf.connect(ng); ng.connect(master); n.start(now); n.stop(now+3.0);
  var o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=131;
  var g2=actx.createGain(); g2.gain.setValueAtTime(0.0001,now+2.2); g2.gain.linearRampToValueAtTime(0.08,now+2.7); g2.gain.linearRampToValueAtTime(0.0001,now+3.5);
  o2.connect(g2); g2.connect(master); o2.start(now+2.2); o2.stop(now+3.6);
  setTimeout(function(){ try{actx.close();}catch(e){} },3800);
}

var started=false;
function drift(){
  if(started)return; started=true;
  go.style.display='none';
  playDream();
  document.body.classList.add('drift');
  line.classList.remove('show');
  setTimeout(function(){ line.textContent='You let go, and drift down into the dreaming.'; line.classList.add('show'); },220);
  narr.textContent='You let go, and drift down into the dreaming, where the businesses the world never launched are kept.';
  setTimeout(function(){
    line.classList.remove('show');
    setTimeout(function(){ line.textContent='A thousand unlived ideas turn, all at once, toward you.'; line.classList.add('show'); },160);
    narr.textContent='A thousand unlived ideas turn, all at once, toward you. Something here already has your name on it.';
  }, 1900);
  try{ sessionStorage.setItem('descended','1'); }catch(e){}
  setTimeout(function(){ location.href='/marketplace.html?entered=1'; }, 3100);
}
go.addEventListener('click',drift);
go.focus();
</script>
</body></html>
