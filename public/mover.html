<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A Dream Mover — Access YP Labs</title>
<meta name="description" content="Businesses worth building, picked out by a Dream Mover. Each one was shaped and proven before it exists — claim one and launch it as your own."/>
<meta property="og:type" content="profile"/>
<meta property="og:title" content="Dreams worth building — Access YP Labs"/>
<meta property="og:description" content="A hand-picked set of pre-proven businesses you can claim and launch as your own."/>
<meta property="og:site_name" content="Access YP Labs"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="Dreams worth building — Access YP Labs"/>
<meta name="twitter:description" content="A hand-picked set of pre-proven businesses you can claim and launch as your own."/>
<link rel="stylesheet" href="/css/kiln.css"/>
<style>
.dream{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;margin:14px 0;}
.dream h3{margin:0 0 6px;}
.pay{font-weight:700;color:#0b804b;}
.tag{display:inline-block;background:#f3f3f3;border-radius:6px;padding:2px 8px;font-size:13px;color:var(--muted);margin-right:6px;}
</style>
</head><body>
<a class="skip" href="#main">Skip to main content</a>
<header class="site"><div class="wrap bar">
  <a class="brand" href="/">Access YP Labs</a>
  <nav class="top" aria-label="Primary"><a href="/marketplace.html">The Dream Market</a></nav>
</div></header>
<main id="main" class="wrap">
  <div id="head"><h1 id="title" tabindex="-1">A Dream Mover</h1></div>
  <div id="status" role="status" aria-live="polite" class="muted">Loading…</div>
  <div id="dreams"></div>
</main>
<script src="/js/a11y.js?v=20260807n"></script><script src="/js/api.js?v=20260807n"></script><script src="/js/nav.js?v=20260807n"></script>
<script>
const slug=new URLSearchParams(location.search).get('slug')||'';
const headEl=document.getElementById('head'), titleEl=document.getElementById('title'),
      statusEl=document.getElementById('status'), dreamsEl=document.getElementById('dreams');
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function money(c){return '$'+((c||0)/100).toFixed(2);}

async function init(){
  if(!slug){ statusEl.textContent='No Dream Mover specified.'; return; }
  try{
    const data=await Kiln.api('/movers/'+encodeURIComponent(slug),{auth:false});
    const m=data.mover||{};
    // The dreamer tag is who this person IS here; the headline is what they chose to say. Show the
    // tag so the same name follows them across listings, the partner board, and this page.
    titleEl.textContent=m.headline||((m.shown_name||m.dreamer_tag||('@'+m.slug))+' — Dream Mover');
    // The mover's own page: their photo, who they chose to appear as, their words, their links.
    // Everything is set with textContent or as attributes on real elements — never innerHTML — so a
    // bio or a link label can't inject anything into the page.
    (function(){
      var head=document.createElement('div');
      if(m.photo_url){
        var img=document.createElement('img');
        img.src=m.photo_url;
        img.alt='Photo of '+(m.shown_name||m.dreamer_tag||'this Dream Mover');
        img.width=96; img.height=96; img.loading='lazy';
        img.style.borderRadius='50%'; img.style.objectFit='cover'; img.style.display='block';
        head.appendChild(img);
      }
      if(m.shown_name){
        var who=document.createElement('p'); who.className='muted';
        who.textContent='Dreams moved by '+m.shown_name;
        head.appendChild(who);
      }
      if(m.bio){ var b=document.createElement('p'); b.textContent=m.bio; head.appendChild(b); }
      var links=Array.isArray(m.links)?m.links:[];
      if(links.length){
        var nav=document.createElement('nav'); nav.setAttribute('aria-label','Links from this Dream Mover');
        var ul=document.createElement('ul');
        links.forEach(function(l){
          if(!l||!l.url) return;
          var li=document.createElement('li'); var a=document.createElement('a');
          a.href=l.url; a.textContent=l.label||l.url;
          a.rel='nofollow noopener noreferrer'; a.target='_blank';
          li.appendChild(a); ul.appendChild(li);
        });
        nav.appendChild(ul); head.appendChild(nav);
      }
      if(head.childNodes.length) titleEl.insertAdjacentElement('afterend', head);
    })();
    // Make the browser tab and any in-app share reflect WHOSE page this is, not a generic title.
    document.title=(m.dreamer_tag||m.headline||('@'+m.slug))+' — Dreams worth building — Access YP Labs';
    if(m.bio){ headEl.appendChild(el('p','muted',m.bio)); }
    statusEl.textContent='';
    render(data.dreams||[]);
    titleEl.focus();
    announce('Promo page for '+(m.dreamer_tag||m.headline||m.slug)+'. '+((data.dreams||[]).length)+' Dreams.',false);
  }catch(e){
    statusEl.textContent = e.status===404 ? 'This Dream Mover page was not found.' : (e.message||'Could not load this page.');
  }
}

function render(dreams){
  dreamsEl.innerHTML='';
  if(!dreams.length){ dreamsEl.appendChild(el('p','muted','No Dreams here yet — check back soon.')); return; }
  const selling=dreams.filter(d=>d.own), champ=dreams.filter(d=>!d.own);
  if(selling.length){ dreamsEl.appendChild(el('h2',null,'Dreams they’re selling')); selling.forEach(d=>dreamsEl.appendChild(card(d))); }
  if(champ.length){ dreamsEl.appendChild(el('h2',null,'Dreams they’re championing')); champ.forEach(d=>dreamsEl.appendChild(card(d))); }
}

function card(d){
  const c=el('div','dream');
  c.appendChild(el('h3',null,d.title||'Untitled Dream'));
  const tags=el('p');
  if(d.category){ tags.appendChild(el('span','tag',String(d.category).replace(/_/g,' '))); }
  tags.appendChild(el('span','tag',money(d.price_cents)));
  c.appendChild(tags);
  if(d.risk_summary){ c.appendChild(el('p','muted',d.risk_summary)); }
  const link=el('a','btn',d.own?'View this Dream':'View this Dream');
  link.href=d.promo_url; link.setAttribute('role','button');
  c.appendChild(link);
  return c;
}

init();
</script>
</body></html>
